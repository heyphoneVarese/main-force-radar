# Phase 4.12 - 前端容器 nginx 配置
#
# 两件事:
#  1) 静态文件 serve + SPA fallback(任何路径 fallback 到 /index.html,
#     未来加 vue-router 时不用改 conf)
#  2) /api/* 反代到 backend service(docker-compose 网络里服务名是 backend)
#
# 不做 HTTPS / 不做 rate limit / 不做静态文件缓存头(Phase 4.12 MVP)。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 backend 容器
    # 注意:proxy_pass 末尾的 /api/ 决定路径重写规则,加斜杠表示"剥掉 location 前缀"
    # 这里保留 /api/ 不剥(后端路由就是 /api/holdings 等)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 推送场景可能 AI 慢,把 backend 超时放宽到 30s
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 健康检查直接打 backend 也方便排查(可选)
    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
